baseURL = "https://example.com/"
title = "hugo-pretalx Test Site"
languageCode = "en"

[module]
  [[module.imports]]
    path = "github.com/GodotFest/hugo-pretalx"

[taxonomies]
  tag = "tags"

# Optional: field name for talk recording URL (default "recording").
# When set on a talk (data or front matter), single page shows embed and cards show "Recording available".
[params]
  pretalxRecordingField = "recording"
  # Room names that render as "special" events (e.g. registration, breaks) in the schedule timeline
  # pretalxSpecialRooms = ["General info"]
